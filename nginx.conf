server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Habilitar compresión gzip para mejorar el rendimiento
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Cabeceras de caché para assets estáticos con hash (js/css generados por Vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service Worker: No cachear nunca para garantizar actualizaciones correctas de la PWA
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Manifest de la PWA: Caché corta
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Type "application/manifest+json";
    }

    # SPA Fallback: Redirigir todas las rutas desconocidas al index.html
    # (Necesario para que React Router funcione correctamente)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
